[project]
name = "pymshbm"
version = "0.2.2"
description = "BIDS-friendly Multi-Session Hierarchical Bayesian Model with Buckner/CBIG numerical validation"
readme = "README.md"
authors = [
    { name = "Russell Poldrack", email = "poldrack@gmail.com" },
    { name = "Logan Bennett" },
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "nibabel>=5.2",
    "h5py>=3.10",
    "scikit-learn>=1.4",
    "zarr>=3.1.5",
]

[project.optional-dependencies]
validation = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8",
    "pytest-cov",
    "ruff>=0.11",
]

[project.urls]
Repository = "https://github.com/lobennett/pyMSHBM"
Issues = "https://github.com/lobennett/pyMSHBM/issues"

[project.scripts]
pymshbm = "pymshbm.cli.bids:main"
pymshbm-fetch-assets = "pymshbm.io.assets:main"
pymshbm-extract-results = "pymshbm.cli.extract_results:main"
pymshbm-wrapper = "pymshbm.cli.wrapper:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
